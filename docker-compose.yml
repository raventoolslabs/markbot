services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markbot-backend
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?schema=markbot
      - CHAT_PROVIDER
      - CHAT_API_KEY
      - CHAT_MODEL_NAME
      - CHAT_TEMPERATURE
      - OLLAMA_BASE_URL
      - PERGAMO_URL
      - PERGAMO_ORGANIZATION
      - PERGAMO_PASSWORD
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_CLIENT_SCOPE
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
    # depends_on:
    #   redis:
    #     condition: service_healthy
    #   db:
    #     condition: service_healthy
    networks:
      - markbot-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: markbot-web
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_URL=http://backend:3002
    depends_on:
      - backend
    networks:
      - markbot-network
    restart: unless-stopped

