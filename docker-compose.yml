# Redes: 'raventoolslabs' une markbot con Pergamo; 'db' y 'redis' dan acceso al
# postgres y al Redis compartidos (solo el backend); 'proxy' es por donde entra
# el nginx del host.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markbot-backend
    ports:
      - "6240:6240"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=6240
      - NODE_ENV=production
      # Redis compartido: la cola usa bull:token-refresh, el mismo que markbot en
      # desarrollo, así que no deben correr los dos a la vez contra él.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}?schema=markbot
      - CHAT_PROVIDER
      - CHAT_API_KEY
      - CHAT_MODEL_NAME
      - CHAT_TEMPERATURE
      - OLLAMA_BASE_URL
      # El contenedor de Pergamo solo expone la entrada (6231), que sirve la API en
      # la raíz; el 6230 es la API de su `npm run dev`.
      - PERGAMO_URL=http://pergamo:6231
      - PERGAMO_ORGANIZATION
      - PERGAMO_PASSWORD
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_CLIENT_SCOPE
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
    networks:
      - raventoolslabs
      - db
      - redis
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: markbot-web
    ports:
      - "6241:6241"
    environment:
      - PORT=6241
      - API_URL=http://backend:6240
    depends_on:
      - backend
    # 'proxy': el nginx del host la publica por su nombre.
    networks:
      - raventoolslabs
      - proxy
    restart: unless-stopped

networks:
  raventoolslabs:
    external: true
  db:
    external: true
  redis:
    external: true
  proxy:
    external: true
