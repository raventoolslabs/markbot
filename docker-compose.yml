# Redes: 'raventoolslabs' une markbot con Pergamo; 'db' da acceso al postgres
# compartido, y solo la necesita el backend.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markbot-backend
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}?schema=markbot
      - CHAT_PROVIDER
      - CHAT_API_KEY
      - CHAT_MODEL_NAME
      - CHAT_TEMPERATURE
      - OLLAMA_BASE_URL
      # Dentro de la red raventoolslabs Pergamo siempre está en su nombre de servicio.
      - PERGAMO_URL=http://pergamo:3000
      - PERGAMO_ORGANIZATION
      - PERGAMO_PASSWORD
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_CLIENT_SCOPE
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - raventoolslabs
      - db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: markbot-web
    # 3003 en el host: el 3000 es de Pergamo.
    ports:
      - "3003:3000"
    environment:
      - API_URL=http://backend:3002
    depends_on:
      - backend
    # 'proxy': el nginx del host la publica por su nombre.
    networks:
      - raventoolslabs
      - proxy
    restart: unless-stopped

  # Propio y sin publicar: los tokens de Google no se mezclan con steamfront-redis.
  redis:
    image: redis:7-alpine
    container_name: markbot-redis
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - raventoolslabs
    restart: unless-stopped

networks:
  raventoolslabs:
    external: true
  db:
    external: true
  proxy:
    external: true
