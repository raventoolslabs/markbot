services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markbot-backend
    environment:
      - PORT=3002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=markbot
      - CHAT_PROVIDER
      - CHAT_API_KEY
      - CHAT_MODEL_NAME
      - CHAT_TEMPERATURE
      - OLLAMA_BASE_URL
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_CLIENT_SCOPE
    depends_on:
      - redis
      - db
    networks:
      - markbot-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: markbot-web
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:3002
    depends_on:
      - backend
    networks:
      - markbot-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: markbot-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data-redis:/data
    networks:
      - markbot-network
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: markbot-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - ./data-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - markbot-network
    restart: unless-stopped

networks:
  markbot-network:
    external: true
